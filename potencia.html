<script>
    var base = parseInt(prompt("Digite a base:"));
    var expoente = parseInt(prompt("Digite o expoente:"));
    var resultado = 1;
    var i = 0;

    while (i < expoente) {
        resultado = resultado * base;
        i = i + 1;
    }

    document.write("O resultado eh: " + resultado);
</script>
